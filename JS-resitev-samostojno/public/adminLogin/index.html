<html lang="sl">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Admin login</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <div class="mainView">
            <form id="authLogin" class="formLogin">
                <h2>Admin login</h2>
                <input class="inputLogin" type="text" id="Name" placeholder="Ime" required />
                <input
                    class="inputLogin"
                    type="password"
                    id="Password"
                    placeholder="Geslo"
                    required
                />
                <div>
                    <button class="submitLogin" type="submit">Prijavi</button>
                </div>
            </form>
        </div>

        <script src="script.js"></script>
    </body>
</html>
