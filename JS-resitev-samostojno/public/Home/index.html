
<html lang="sl">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Rezervacija igrišč</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <div class="mainView">
            <nav class="sidePanel">
                <div class="sidePanelLinks">
                    <a href="/" class="navLink">Rezervacije</a>
                </div>
            </nav>

            <div class="content">
                <header class="topbar">
                    <h1>Rezervacija</h1>
                </header>

                <section class="courtsGrid" id="courtsGrid"></section>

                <div class="modalOverlay hidden" id="modalOverlay">
                    <div class="modal">
                        <button
                            type="button"
                            class="modalClose"
                            id="modalClose"
                        >
                            &times;
                        </button>
                        <h2 id="modalTitle">Rezervacija</h2>

                        <form id="reservationForm">
                            <input type="hidden" id="modalCourtId" />
                            <input
                                type="text"
                                id="modalName"
                                placeholder="Ime"
                                required
                            />
                            <input
                                type="text"
                                id="modalSurname"
                                placeholder="Priimek"
                                required
                            />
                            <input
                                type="email"
                                id="modalEmail"
                                placeholder="Email"
                                required
                            />
                            <input type="date" id="modalDate" required />
                            <select id="modalDuration" required>
                                <option value="1">1 ura</option>
                                <option value="2">2 uri</option>
                            </select>
                            <select id="modalStart" required>
                                <option value="">Najprej izberi datum</option>
                            </select>
                            <div class="formActions">
                                <button type="submit">Rezerviraj</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <script src="script.js"></script>
    </body>
</html>
