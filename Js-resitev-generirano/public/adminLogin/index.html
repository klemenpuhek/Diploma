<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin prijava</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="login-card">
    <h1>Admin prijava</h1>
    <form id="login-form" class="login-form">
      <input type="text" id="username" placeholder="Uporabniško ime" required />
      <input type="password" id="password" placeholder="Geslo" required />
      <button type="submit">Prijava</button>
      <p id="error-message" class="error hidden">Napačno uporabniško ime ali geslo</p>
    </form>
  </div>

  <script src="script.js"></script>
</body>
</html>
